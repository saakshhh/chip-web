<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Chip Web</title>
<!-- Page layout. Owner: Alex. Each view draws into its own <section>; see js/main.js. -->
<link rel="stylesheet" href="css/style.css">
</head>
<body class="loading">
<header class="site-header">
  <div>
    <h1>The Chip Web</h1>
    <p class="subtitle">Who supplies the world's chips, and who depends on whom? Global integrated-circuit trade, 1995 to 2024.</p>
  </div>
  <div class="controls">
    <label>Product
      <select id="product">
        <option value="8542">Integrated circuits (HS 8542)</option>
        <option value="8541">Other semiconductor devices (HS 8541)</option>
      </select>
    </label>
    <span id="selection" class="selection" hidden>
      <span id="selection-name"></span>
      <button id="clear-selection" type="button" aria-label="Clear the selected country">Clear</button>
    </span>
  </div>
</header>

<main class="layout">
  <section id="network" class="panel panel-network" aria-label="Trade network map"></section>
  <aside class="side">
    <section id="dependency" class="panel" aria-label="Country dependency"></section>
    <section id="scatter" class="panel" aria-label="Concentration scatterplot"></section>
  </aside>
  <section id="timeline" class="panel panel-timeline" aria-label="Timeline"></section>
</main>

<footer class="site-footer">
  Data: CEPII BACI (HS92, release 202601). Country positions: world-countries. Map: world-atlas / Natural Earth.
  <a href="check.html">Data check page</a>
</footer>

<div id="loading-message" class="loading-message">Loading data…</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
